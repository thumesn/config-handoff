# Keep the prefix default to reduce relearning cost in VS Code.
set -g prefix C-b
unbind C-b
bind-key C-b send-prefix

# Make tmux feel more immediate and terminal-like.
set -sg escape-time 0
set -g focus-events on
set -g history-limit 20000
set -g mouse on
setw -g mode-keys vi

# Use true color and a modern terminal description.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",tmux-256color:clipboard"

# Windows and panes should behave more like tabs/splits in editors.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
setw -g automatic-rename off
setw -g pane-border-status top
setw -g pane-border-format " #{pane_index}:#{pane_title} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour45"

# Put the status line on top so it feels closer to terminal tabs.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80
set -g status-justify left
set -g status-style "bg=colour236,fg=colour252"
set -g status-left "#[bold,bg=colour31,fg=white] #S #[bg=colour236,fg=colour252] "
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M #[default]"
setw -g window-status-separator ""
setw -g window-status-format "#[bg=colour238,fg=colour250]  #I:#W  #[bg=colour236,fg=colour252]"
setw -g window-status-current-format "#[bold,bg=colour45,fg=black]  #I:#W  #[bg=colour236,fg=colour252]"
setw -g window-status-activity-style "fg=colour220"
setw -g window-status-bell-style "bold,bg=colour220,fg=black"

# New windows and splits stay in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Faster pane movement with vim-style keys after the prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Quick pane layouts for a "main terminal + side panels" workflow.
set -g main-pane-width 70%
set -g main-pane-height 70%
bind-key m select-layout main-vertical
bind-key M select-layout main-horizontal
bind-key e select-layout even-vertical
bind-key E select-layout tiled

# Quality-of-life helpers.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key a command-prompt -I "#{pane_title}" "select-pane -T '%%'"
bind-key K clear-history \; display-message "scrollback cleared"
bind-key [ copy-mode
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down \; if-shell -F "#{==:#{scroll_position},0}" "send-keys -X cancel"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel
bind-key Y run-shell "tmux save-buffer - | sed -n '1,120p' >/tmp/tmux-last-copy.txt" \; display-message 'Saved current tmux buffer to /tmp/tmux-last-copy.txt'

# Cleaner copy experience inside VS Code terminal.
set -g set-clipboard on

# Persist sessions across tmux server crashes and machine restarts.
# Continuum saves in the background; Resurrect restores layout, cwd and pane history.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-hook-post-restore-all '/home/chaofeng/.tmux/scripts/restore-active-positions.sh'
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Keep TPM last so plugins can extend options such as status-right safely.
run-shell '~/.tmux/plugins/tpm/tpm'
